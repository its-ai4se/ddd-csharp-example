name: .NET Test Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/ddd-csharp-example.sln

      - name: Build project
        run: dotnet build src/ddd-csharp-example.sln --no-restore

      - name: Run tests
        run: dotnet test src/ddd-csharp-example.sln --no-build --verbosity normal